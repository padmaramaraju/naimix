name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened?, description: Steps to reproduce, expected vs actual }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: naimix version / build (dev, qa, prod) }
  - type: textarea
    id: logs
    attributes: { label: Logs (remove tokens and secrets), render: shell }
