# Named backend gateways. Endpoint configs reference these by name so
# credentials and base URLs live in one place instead of being repeated
# (and duplicated by mistake) across every endpoint file.
#
# Secrets should never be hard-coded here -- use ${env.VAR_NAME} and set the
# real value in your .env file (see .env.example).

gateways:
  crmJson:
    kind: json
    baseUrl: ${env.DEMO_JSON_BASE_URL}

  crmXml:
    kind: xml
    baseUrl: ${env.DEMO_XML_BASE_URL}

  crmSoap:
    kind: soap
    wsdl: ${env.DEMO_SOAP_WSDL_URL}

  demoDb:
    kind: sql
    client: better-sqlite3
    connection:
      filename: ${env.DEMO_SQLITE_PATH}
    useNullAsDefault: true

  # Same demo backend as crmJson, but requires a caller session -- demoes
  # the auth feature (see AUTH_DESIGN_NOTES.md and config/authProviders.yaml).
  # A caller must first POST /auth/login/demoLogin, then send the opaque
  # token it gets back as "Authorization: Bearer <token>" on any endpoint
  # that calls through this gateway.
  crmJsonAuthed:
    kind: json
    baseUrl: ${env.DEMO_JSON_BASE_URL}
    requiresAuth: demoLogin

  # Same demo backend again, but behind the LDAP/AD auth provider instead --
  # demoes step 2 of AUTH_DESIGN_NOTES.md's phased build order. Log in via
  # POST /auth/login/demoLdap (jdoe/asmith/bwayne, password "password123").
  crmJsonAuthedLdap:
    kind: json
    baseUrl: ${env.DEMO_JSON_BASE_URL}
    requiresAuth: demoLdap
