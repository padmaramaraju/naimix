id: xml-customers-list
description: List all customers from the demo XML backend.
input: []
backend:
  type: xml
  gateway: crmXml
  url: /customers/xml
  method: GET
  timeoutMs: 10000
output:
  fields:
    - kind: array
      target: customers
      root: $.customers.customer[*]
      fields:
        - target: id
          source: $.id
        - target: name
          source: $.firstName
        - target: status
          source: $.status
